aid: amazon-lookout-for-equipment

name: Amazon Lookout for Equipment

description: Amazon Lookout for Equipment uses machine learning to analyze sensor data from your industrial equipment and detect abnormal patterns
  that signal potential failures. It helps you avoid unplanned equipment downtime by identifying potential equipment failures before they occur.

